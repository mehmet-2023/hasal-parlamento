<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HASAL27 - Camera Debugger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    #info {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(0,0,0,0.7); color: #0f0; font: 12px monospace;
      padding: 10px 14px; border-radius: 6px; pointer-events: none;
      max-width: 340px; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="info">
    Kamerayı hareket ettir, <b>0-4</b> tuşlarıyla konum kaydet.<br>
    Kayıtlı konumlar console'a yazdırılır.<br>
    <span id="status">Kayıt yok</span>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ── Renderer ──
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    // ── Scene ──
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    // ── Camera ──
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(10, 8, 10);

    // ── Controls ──
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 2, 0);
    controls.minDistance = 2;
    controls.maxDistance = 80;

    // ── Lights ──
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x362a28, 0.4);
    scene.add(hemiLight);

    // ── Load GLB ──
    let model = null;
    const loader = new GLTFLoader();
    loader.load(
      'parliament.glb',
      (gltf) => {
        model = gltf.scene;
        model.traverse((child) => {
          if (child.isMesh) child.castShadow = true;
        });

        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        const maxDim = Math.max(size.x, size.y, size.z);
        const targetSize = 15;
        const scale = targetSize / maxDim;
        model.scale.setScalar(scale);

        model.position.sub(center.multiplyScalar(scale));
        model.position.y -= (box.min.y * scale);

        scene.add(model);
        console.log('Model yüklendi. Scale:', scale, 'Boyut:', size);
      },
      (xhr) => {
        if (xhr.lengthComputable) console.log(`Yükleniyor: ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`);
      },
      (err) => console.error('Model yüklenemedi:', err)
    );

    // ── Saved Positions ──
    const savedPositions = [];
    const MAX_SLOTS = 5;

    function getCameraSnapshot() {
      return {
        position: {
          x: +camera.position.x.toFixed(4),
          y: +camera.position.y.toFixed(4),
          z: +camera.position.z.toFixed(4)
        },
        target: {
          x: +controls.target.x.toFixed(4),
          y: +controls.target.y.toFixed(4),
          z: +controls.target.z.toFixed(4)
        },
        fov: camera.fov
      };
    }

    function saveToSlot(index) {
      const snap = getCameraSnapshot();
      savedPositions[index] = snap;

      console.log(`%c── Kayıt #${index} ──`, 'color: #0f0; font-weight: bold');
      console.log(JSON.stringify(snap, null, 2));

      console.log('%c── TÜM KONUMLAR (kopyala) ──', 'color: #ff0; font-weight: bold');
      const cleaned = savedPositions.filter(Boolean).map(p => ({
        position: p.position,
        target: p.target,
        fov: p.fov
      }));
      console.log(JSON.stringify(cleaned, null, 2));

      updateStatus();
    }

    function updateStatus() {
      const filled = savedPositions.filter(Boolean).length;
      document.getElementById('status').textContent =
        filled === 0 ? 'Kayıt yok' : `${filled}/${MAX_SLOTS} konum kaydedildi`;
    }

    // ── Key bindings ──
    window.addEventListener('keydown', (e) => {
      const key = parseInt(e.key);
      if (key >= 0 && key <= 4) {
        saveToSlot(key);
      }
    });

    // ── Continuous log toggle ──
    let logEnabled = false;
    window.addEventListener('keydown', (e) => {
      if (e.key === '`') {
        logEnabled = !logEnabled;
        console.log('Kamera log:', logEnabled ? 'AÇIK' : 'KAPALI');
      }
    });

    // ── Resize ──
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Animate ──
    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      if (logEnabled) {
        const s = getCameraSnapshot();
        console.log(`pos(${s.position.x}, ${s.position.y}, ${s.position.z}) target(${s.target.x}, ${s.target.y}, ${s.target.z}) fov(${s.fov})`);
      }

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
